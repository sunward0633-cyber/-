# OpenClash / Clash.Meta 中国大陆优化完整分流版
# 使用前请替换所有 <...> 占位符

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
geodata-mode: true

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  # 大陆网络环境下部分运营商与设备对 H3/QUIC DoH 兼容性较差，默认关闭以优先保障稳定性
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 代理服务器域名解析必须使用大陆可直连的 DNS，否则形成先有鸡还是先有蛋的死循环
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "ntp.*.com"
    - "ntp.*.cn"
    - "+.market.xiaomi.com"
    - "+.miwifi.com"

proxies:
  # ── Shadowsocks 示例 ──
  # - name: 主节点
  #   type: ss
  #   server: <SERVER>
  #   port: <PORT>
  #   cipher: <CIPHER>
  #   password: <PASSWORD>
  #   udp: true

  # ── VLESS + Reality 示例 ──
  - name: 主节点
    type: vless
    server: <SERVER>
    port: 443
    uuid: <UUID>
    network: tcp
    tls: true
    udp: true
    servername: <SNI>               # 例如 www.microsoft.com
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    reality-opts:
      public-key: <PUBLIC_KEY>
      short-id: <SHORT_ID>

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 主节点
      - DIRECT

  - name: 自动选择
    type: url-test
    proxies:
      - 主节点
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 谷歌服务
    type: select
    proxies:
      - 节点选择
      - 主节点
      - DIRECT

  - name: 电报消息
    type: select
    proxies:
      - 节点选择
      - 主节点
      - DIRECT

  - name: AI服务
    type: select
    proxies:
      - 节点选择
      - 主节点
      - DIRECT

  - name: GitHub服务
    type: select
    proxies:
      - 节点选择
      - 主节点
      - DIRECT

  - name: 国外媒体
    type: select
    proxies:
      - 节点选择
      - 主节点
      - DIRECT

  - name: 微软服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 主节点

  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 主节点

  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 国内服务
    type: select
    proxies:
      - DIRECT
      - 节点选择

  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - 主节点
      - DIRECT

# ⚠️ 注意：rules 中每条规则必须顶格对齐（两个空格 + 短横线），多余缩进会导致 YAML 解析失败
rules:
  - GEOSITE,category-ads-all,广告拦截
  - GEOSITE,private,国内服务
  - GEOSITE,apple,苹果服务
  # 子集 / 重叠规则必须排在父集之前，否则会被父集吞掉：
  #   github ⊂ microsoft — github 被微软规则 DIRECT 吞掉导致超时
  #   youtube ⊂ google   — youtube 被谷歌规则吞掉，无法单独选择国外媒体策略组
  #   netflix/disney 与 google GeoSite 存在重叠，放在 google 之前以优先匹配国外媒体策略组
  - GEOSITE,github,GitHub服务
  - GEOSITE,microsoft,微软服务
  - GEOSITE,youtube,国外媒体
  - GEOSITE,netflix,国外媒体
  - GEOSITE,disney,国外媒体
  - GEOSITE,google,谷歌服务
  - GEOSITE,telegram,电报消息
  - GEOSITE,openai,AI服务
  - GEOSITE,cn,国内服务
  - GEOIP,private,国内服务,no-resolve
  - GEOIP,CN,国内服务,no-resolve
  - MATCH,漏网之鱼
